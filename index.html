<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<title>Jobs · Horn Films</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Envie seus jobs para a Horn Films">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jobs Horn">
<script src="config.js?v=5"></script>
<style>
:root{
  /* identidade Horn Films (mesma do portfólio) */
  --papel:#141413; --branco:#1E1E1C; --nevoa:#232321; --tinta:#ECEBE3; --tinta2:#9A988F; --tinta3:#6F6D66;
  --linha:#34332F; --linha2:#46453F; --rec:#FF4A2B;
  --azul:#FF4A2B; --azul-fundo:rgba(255,74,43,.12); --azul-borda:rgba(255,74,43,.4); --azul-escuro:#262624;
  --ambar:#E9B65C; --ambar-fundo:rgba(233,182,92,.12); --ambar-borda:rgba(233,182,92,.38);
  --verde:#7FD3A9; --verde-fundo:rgba(127,211,169,.12); --verde-borda:rgba(127,211,169,.38);
  --vermelho:#FF7A8A; --vermelho-fundo:rgba(255,122,138,.12); --vermelho-borda:rgba(255,122,138,.4);
  --roxo:#B9A6FF; --roxo-fundo:rgba(185,166,255,.12); --roxo-borda:rgba(185,166,255,.38);
  --sombra:none; --r:14px;
  --f:"Archivo","Arial Narrow",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--papel);color:var(--tinta);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
.ser{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--tinta);background:var(--branco);border:1px solid var(--linha2);border-radius:10px;padding:12px;width:100%;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tinta2) 50%),linear-gradient(135deg,var(--tinta2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--tinta2);box-shadow:none}
input[type=date],input[type=time]{min-height:46px}
.wrap{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}

/* cabeçalho */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:64px;flex:none;display:block}.logo svg{width:100%;height:auto;display:block}
.top{padding-bottom:14px;border-bottom:1px solid var(--linha)}
.top h1{font-size:24px;font-weight:800;font-stretch:112%;letter-spacing:-.03em;line-height:1.1}
.top h1 .ser{font-stretch:100%;font-size:1.08em}
.top p{color:var(--tinta2);font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.sync{margin-left:auto;font-size:10px;color:var(--tinta2);text-align:right;max-width:120px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rec);flex:none;animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{to{opacity:.15}}

.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.monthnav{display:flex;align-items:center;justify-content:space-between;padding:10px;margin-bottom:12px}
.monthnav b{font-size:17px;font-weight:800;font-stretch:110%;letter-spacing:-.02em}
.nbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--linha2);display:grid;place-items:center;color:var(--tinta2);font-size:18px;background:var(--branco)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{padding:12px 14px}
.stat small{display:block;color:var(--tinta2);font-size:10.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.stat b{display:block;font-size:32px;font-weight:800;font-stretch:115%;letter-spacing:-.03em;line-height:1.15}
.stat span{color:var(--tinta3);font-size:12px}
.stat.red b{color:var(--vermelho)}

/* mini calendário */
.cal{padding:12px;margin-bottom:12px}
.cal-dow,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow div{font-size:11px;color:var(--tinta3);font-weight:600;padding-bottom:4px}
.cd{height:42px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500}
.cd.out{color:var(--linha2)}
.cd.today span{background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.cd.sel{background:var(--azul-fundo)}
.cd i{display:flex;gap:2px;height:5px}
.cd i u{width:5px;height:5px;border-radius:50%;background:var(--tinta)}
.cd i u.pessoal{background:var(--roxo)}
.cal-toggle{display:block;width:100%;text-align:center;font-size:13px;color:var(--azul);font-weight:600;padding-top:8px}

/* lista por dia */
.dayhead{display:flex;align-items:center;gap:10px;background:var(--azul-escuro);color:#fff;border-radius:10px;padding:11px 14px;margin:16px 0 8px;scroll-margin-top:12px}
.dayhead{border:1px solid var(--linha)}
.dayhead b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);font-weight:600}
.dayhead span{color:var(--tinta2);font-size:12px;font-family:var(--mono)}
.dayhead em{margin-left:auto;font-style:normal;background:rgba(255,255,255,.14);border-radius:20px;min-width:26px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 8px}
.dayhead.today{background:var(--azul)}
.dayhead.today{border-color:var(--rec)}.dayhead.today span{color:#FFD9D1}
.dayhead.warn{background:var(--vermelho)}
.dayhead.warn{background:#3A1F22;border-color:var(--vermelho-borda);color:var(--vermelho)}.dayhead.warn span{color:var(--vermelho)}
.dayhead.muted{background:var(--branco);color:var(--tinta);border:1px solid var(--linha)}
.dayhead.muted span{color:var(--tinta3)}
.dayhead.muted em{background:var(--papel)}
.it{display:flex;gap:12px;padding:14px;margin-bottom:8px;border-left:4px solid var(--linha2);cursor:pointer;width:100%;text-align:left}
.it.pro{border-left-color:var(--tinta)}
.it.pessoal{border-left-color:var(--roxo)}
.it.done{opacity:.6}
.it .hr{font-family:var(--mono);font-weight:600;font-size:14px;min-width:50px;padding-top:1px}
.it .hr.nt{color:var(--tinta3);font-weight:600;font-size:12px;padding-top:2px}
.it .bd{flex:1;min-width:0}
.it .tt{font-weight:600;font-size:15.5px;line-height:1.3}
.it.done .tt{text-decoration:line-through}
.it .sub{color:var(--tinta2);font-size:13.5px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid var(--linha2);color:var(--tinta2);background:var(--branco)}
.pill.ok{background:var(--verde-fundo);border-color:var(--verde-borda);color:var(--verde)}
.pill.late{background:var(--vermelho-fundo);border-color:var(--vermelho-borda);color:var(--vermelho)}
.pill.todo{background:var(--ambar-fundo);border-color:var(--ambar-borda);color:var(--ambar)}
.pill.now{background:var(--azul-fundo);border-color:var(--azul-borda);color:var(--azul)}
.pill.ps{background:var(--roxo-fundo);border-color:var(--roxo-borda);color:var(--roxo)}
.empty{color:var(--tinta3);text-align:center;padding:26px 16px;font-size:14px}
.brief{padding:14px;margin-bottom:12px;display:none}
.brief.on{display:block}
.brief p{white-space:pre-wrap;font-size:14px;color:var(--tinta2);line-height:1.55}
.brief h3{font-size:13px;color:var(--azul);margin-bottom:6px}
.chips{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--linha2);background:var(--branco);font-size:13px;font-weight:600;color:var(--tinta2);white-space:nowrap}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,19,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--linha);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tab{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--tinta3);padding:4px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--tinta)}
.fab{width:60px;height:60px;border-radius:50%;background:var(--rec);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(255,74,43,.35);margin:-28px 14px 0}
.fab svg{width:28px;height:28px}

/* folha (sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--papel);border-radius:18px 18px 0 0;z-index:11;transform:translateY(105%);transition:transform .25s ease,visibility .25s;visibility:hidden;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none;visibility:visible}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px;bottom:auto;top:50%;transform:translateY(-50%) scale(.98);opacity:0;pointer-events:none;border-radius:18px;transition:.2s}.sheet.open{transform:translateY(-50%);opacity:1;pointer-events:auto}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--linha2);margin:4px auto 12px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h2{font-size:24px;font-weight:800;font-stretch:110%;letter-spacing:-.03em;line-height:1.05;flex:1}
.sh-head h2 .ser{font-stretch:100%}
.back{padding:8px 14px;border:1px solid var(--linha2);border-radius:999px;font-size:13px;font-weight:600;background:var(--branco)}
.lbl{font-size:13px;font-weight:600;color:var(--tinta2);margin:4px 0 8px}
.opt{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;width:100%;text-align:left}
.opt:active{background:var(--nevoa)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--nevoa);color:var(--tinta);border:1px solid var(--linha);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.ps{background:var(--roxo-fundo);color:var(--roxo)}
.ico.ok{background:var(--verde-fundo);color:var(--verde)}
.opt b{display:block;font-size:17px;font-weight:700;font-stretch:105%;letter-spacing:-.01em}
.opt span{display:block;font-size:13.5px;color:var(--tinta2);margin-top:1px}
.quick{display:flex;gap:8px;padding:8px;margin-bottom:14px}
.quick input{border:0;box-shadow:none;padding:10px 6px}
.quick input:focus{box-shadow:none}
.btn{padding:14px 20px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--tinta);color:var(--papel)}
.btn.sec{background:var(--branco);border:1px solid var(--linha2)}
.btn.dan{color:var(--vermelho)}
.btn.full{width:100%}
.btn:disabled{opacity:.55}
.note{font-size:13px;color:var(--tinta2);padding:12px 14px;margin-bottom:10px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld label i{font-style:normal;color:var(--tinta3);font-weight:500}
.fld .hint{font-size:12px;color:var(--tinta3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3);font-weight:700;margin:18px 0 10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:12px;cursor:pointer}
.check input{display:none}
.check .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--linha2);flex:none;display:grid;place-items:center;margin-top:1px}
.check input:checked + .bx{background:var(--azul);border-color:var(--azul)}
.check input:checked + .bx::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check b{display:block;font-size:14px}
.check span{display:block;font-size:12.5px;color:var(--tinta2)}
.seg{display:flex;background:var(--branco);border:1px solid var(--linha2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:600;color:var(--tinta2)}
.seg button.on{background:var(--tinta);color:var(--papel)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.det{padding:16px;margin-bottom:12px}
.det h3{font-size:22px;font-weight:800;font-stretch:108%;letter-spacing:-.02em;line-height:1.15}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:14px}
.det dt{color:var(--tinta3)}
.det p{white-space:pre-wrap;font-size:14px;color:var(--tinta2);margin-top:12px}

/* entregas */
.ent{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;border-left:4px solid var(--verde);cursor:pointer}
.ent .bd{flex:1;min-width:0}
.ent .tt{font-weight:600}
.ent .sub{font-size:13px;color:var(--tinta2);margin-top:2px}
.rev{display:flex;align-items:center;gap:6px;flex:none}
.rev button{width:34px;height:34px;border-radius:9px;border:1px solid var(--linha2);color:var(--tinta2);font-size:18px;background:var(--branco)}
.rev .num{min-width:52px;text-align:center;font-size:11px;color:var(--tinta3)}
.rev .num b{display:block;font-size:22px;font-weight:800;font-stretch:115%;color:var(--tinta);line-height:1.1}
.rev .num.hi b{color:var(--vermelho)}
.bars{padding:14px}
.bar-row{margin-bottom:12px}
.bar-row .tp{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bar-row .tp span{color:var(--tinta3);font-size:12px;text-align:right}
.bar{height:8px;border-radius:5px;background:var(--papel);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.p{background:var(--tinta)} .bar i.r{background:var(--ambar-borda)}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3);font-weight:700;margin:14px 0 8px}
.grp:first-child{margin-top:0}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--tinta);color:var(--papel);padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.view{display:none}.view.on{display:block}
.gear{width:38px;height:38px;border-radius:50%;border:1px solid var(--linha2);display:grid;place-items:center;color:var(--tinta2);flex:none}
.gear svg{width:18px;height:18px}
.login{position:fixed;inset:0;z-index:30;background:var(--papel);display:none;align-items:center;justify-content:center;padding:24px}
.login.on{display:flex}
.login-in{width:100%;max-width:380px}
.login svg.lg{width:180px;height:auto;display:block;margin-bottom:22px}
.login h2{font-size:34px;font-weight:800;font-stretch:112%;letter-spacing:-.035em;line-height:1}
.login h2 .ser{font-stretch:100%}
.login p{color:var(--tinta2);margin:14px 0 26px}
.login .err{color:var(--vermelho);font-size:13px;margin-top:12px;min-height:18px}
.banner{font-size:12px;color:var(--ambar);background:var(--ambar-fundo);border:1px solid var(--ambar-borda);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none}
.banner.on{display:block}
.top h1,.top p{white-space:nowrap}
.sync{white-space:nowrap;max-width:none}
@media (max-width:480px){.sync{font-size:0;gap:0}.top h1{font-size:22px}}
.calbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<style>
.warnbox{font-size:13px;color:var(--ambar);background:var(--ambar-fundo);border:1px solid var(--ambar-borda);border-radius:10px;padding:10px 12px;margin:-4px 0 12px;display:none}
.warnbox.on{display:block}
.warnbox b{color:var(--tinta)}
.warnbox ul{margin:6px 0 0 16px}
.who{font-size:12px;color:var(--tinta3);margin-top:6px}
.tabs2{display:flex;gap:6px;margin:4px 0 2px}
.fabwrap{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(20,20,19,.95) 35%);z-index:5}
.fabwrap .btn{max-width:620px;margin:0 auto;display:block;width:100%;background:var(--rec);color:#fff;font-size:16px}
.fabwrap .fabrow{max-width:620px;margin:0 auto;display:flex;gap:8px}
.fabwrap .fabrow .btn{flex:1;margin:0}
.fabwrap .fabrow .btn.cola{flex:0 0 auto;background:var(--papel);color:var(--tinta);border:1px solid var(--linha2)}
.pj{border:1px solid var(--linha2);border-radius:14px;padding:12px;margin-bottom:12px;background:rgba(255,255,255,.02)}
.pj-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--tinta3)}
.pj-h b{color:var(--tinta);font-size:14px;flex:1}
.pj .fld{margin-bottom:8px}
.login .tog{background:none;border:0;color:var(--tinta2);font-size:13px;text-decoration:underline;margin-top:10px;cursor:pointer}
.pill.novo{background:var(--azul-fundo);border-color:var(--azul-borda);color:var(--azul)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo" aria-label="Horn Films"><svg viewBox="0 0 680 400" aria-hidden="true"><g transform="translate(15,15)" fill="none" stroke="#ECEBE3" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><path d="M110 92 L100 268"/><path d="M192 72 L184 270"/><path d="M58 190 L222 172"/><path d="M300 128 C254 122 238 205 262 254 C284 290 346 268 350 206 C354 150 336 118 300 128"/><path d="M388 96 L380 272"/><path d="M388 100 C456 82 478 150 414 192 L386 198"/><path d="M416 192 L466 272"/><path d="M502 272 L510 104 L570 264 L582 78"/></g><circle cx="316" cy="215" r="13" fill="#FF4A2B"/><circle cx="127" cy="333" r="14" fill="#ECEBE3"/></svg></div>
    <div><h1 id="hTitle">Seus <span class="ser">jobs</span></h1><p id="hSub">Horn Films · envio de jobs</p></div>
    <div class="sync" id="status">Conectando…</div>
    <button class="gear" id="gearBtn" aria-label="Conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </div>

  <div class="card monthnav">
    <button class="nbtn" id="prevM" aria-label="Mês anterior">‹</button>
    <b id="monthLabel"></b>
    <button class="nbtn" id="nextM" aria-label="Próximo mês">›</button>
  </div>
  <div class="stats">
    <div class="card stat"><small>Jobs no mês</small><b id="sMes">0</b><span>agendados</span></div>
    <div class="card stat"><small>Próximos 7 dias</small><b id="sSemana">0</b><span>para entregar</span></div>
  </div>
  <div class="card cal">
    <div class="cal-dow"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
    <div class="cal-days" id="days"></div>
  </div>
  <div class="chips" id="filters">
    <button class="chip on" data-f="todos">Todos os jobs</button>
    <button class="chip" data-f="meus">Só os meus</button>
  </div>
  <div id="lista"></div>
</div>

<div class="fabwrap"><button class="btn" id="novoBtn">+ Enviar novo job</button></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<div class="login on" id="login"><div class="login-in">
  <div style="width:150px;margin-bottom:20px"><div aria-label="Horn Films"><svg viewBox="0 0 680 400" aria-hidden="true"><g transform="translate(15,15)" fill="none" stroke="#ECEBE3" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><path d="M110 92 L100 268"/><path d="M192 72 L184 270"/><path d="M58 190 L222 172"/><path d="M300 128 C254 122 238 205 262 254 C284 290 346 268 350 206 C354 150 336 118 300 128"/><path d="M388 96 L380 272"/><path d="M388 100 C456 82 478 150 414 192 L386 198"/><path d="M416 192 L466 272"/><path d="M502 272 L510 104 L570 264 L582 78"/></g><circle cx="316" cy="215" r="13" fill="#FF4A2B"/><circle cx="127" cy="333" r="14" fill="#ECEBE3"/></svg></div></div>
  <h2>Envie seu <span class="ser">job</span></h2>
  <p id="loginTxt">Entre com a sua conta para mandar jobs para a Horn Films e ver a agenda de entregas.</p>
  <div id="loginArea">
    <button class="btn pri full" id="googleBtn">Entrar com o Google</button>
    <div class="sec-t" style="text-align:center;margin:18px 0 10px">ou com e-mail e senha</div>
    <form id="emailForm" style="display:grid;gap:8px">
      <input id="lgNome" placeholder="seu nome" autocomplete="name" style="display:none">
      <input type="email" id="lgEmail" placeholder="seu e-mail" autocomplete="username" required>
      <input type="password" id="lgPass" placeholder="senha (mínimo 6 caracteres)" autocomplete="current-password" required minlength="6">
      <button class="btn sec full" type="submit" id="emailBtn">Entrar</button>
    </form>
    <button class="tog" id="togCriar">Primeiro acesso? Criar conta com e-mail e senha</button>
  </div>
  <div class="err" id="loginErr"></div>
</div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,"0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const WD = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  const fmtD = s => { const d = parseISO(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
  const CLIENTES = ["Tree Tower","Cidade dos Lagos","Comtudo","Dal Pozzo","Saka","Colégio Start","Colégio Londrinense","Churrascaria Cabaña"];
  const TIPOS = ["Motion","Vídeo","Edição","Reels","Arte / post","Roteiro","Captação","Telas / painel","Outro"];
  const STATUS = { novo:["Novo","novo"], producao:["Em produção","todo"], alteracao:["Em alteração","late"], entregue:["Entregue","ok"] };

  let now = new Date(), TODAY = iso(now), view = new Date(now.getFullYear(), now.getMonth(), 1);
  let jobs = [], filtro = "todos", me = null, api = null, criar = false, dono = false, equipe = { emails: [] };

  const toast = msg => { const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800); };
  const setStatus = s => $("#status").textContent = s;
  const meuJob = j => me && j.enviadoPor && j.enviadoPor.uid === me.uid;
  const primeiroNome = n => String(n||"").trim().split(/\s+/)[0] || "alguém";

  /* ---------- render ---------- */
  function render(){
    $("#monthLabel").textContent = `${MONTHS[view.getMonth()]} de ${view.getFullYear()}`;
    const mk = `${view.getFullYear()}-${pad(view.getMonth()+1)}`;
    const in7 = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+7));
    $("#sMes").textContent = jobs.filter(j=>(j.dataEntrega||"").startsWith(mk)).length;
    $("#sSemana").textContent = jobs.filter(j=>j.status!=="entregue" && j.dataEntrega>=TODAY && j.dataEntrega<=in7).length;
    // calendário
    const by = {}; jobs.forEach(j=>{ if(j.dataEntrega) (by[j.dataEntrega] ||= []).push(j); });
    const start = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
    let h = "";
    for(let k=0;k<42;k++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+k), key = iso(d);
      if(k%7===0 && k>0 && d.getMonth()!==view.getMonth() && d > view) break;
      const l = by[key]||[];
      h += `<button class="cd ${d.getMonth()!==view.getMonth()?"out":""} ${key===TODAY?"today":""}" data-d="${key}"><span>${d.getDate()}</span><i>${l.slice(0,3).map(()=>"<u></u>").join("")}</i></button>`;
    }
    $("#days").innerHTML = h;
    // lista
    const vis = jobs.filter(j => (j.dataEntrega||"").startsWith(mk) && (filtro==="todos" || meuJob(j)));
    const g = {}; vis.forEach(j => (g[j.dataEntrega] ||= []).push(j));
    const keys = Object.keys(g).sort();
    $("#lista").innerHTML = keys.length ? keys.map(k => {
      const l = g[k].sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99")), d = parseISO(k);
      return `<div class="dayhead ${k===TODAY?"today":""}" id="d-${k}"><b>${k===TODAY?"Hoje":WD[d.getDay()]}</b><span>${fmtD(k)}</span><em>${l.length}</em></div>` + l.map(card).join("");
    }).join("") : `<div class="card empty">Nenhum job em ${MONTHS[view.getMonth()].toLowerCase()}${filtro==="meus"?" enviado por você":""}.<br>Toque em <b>Enviar novo job</b>.</div>`;
  }
  function card(j){
    const st = STATUS[j.status] || STATUS.novo;
    return `<button class="card it pro" data-id="${j.id}" style="${meuJob(j)?"border-left-color:var(--rec)":""}">
      <div class="hr ${j.hora?"":"nt"}">${j.hora || "entrega"}</div>
      <div class="bd"><div class="tt">${esc(j.titulo)}</div>
        <div class="pills"><span class="pill">${esc(j.cliente)}</span>${j.tipo?`<span class="pill">${esc(j.tipo)}</span>`:""}<span class="pill ${st[1]}">${st[0]}</span></div>
        <div class="who">por ${meuJob(j) && !j.solicitante ? "você" : esc(primeiroNome(j.solicitante || (j.enviadoPor && j.enviadoPor.nome)))}${j.solicitante ? " · via Pedro" : ""}</div></div></button>`;
  }

  /* ---------- sheet ---------- */
  const openSheet = html => { $("#sheetBody").innerHTML = html; $("#sheetBg").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0; };
  const closeSheet = () => { $("#sheetBg").classList.remove("open"); $("#sheet").classList.remove("open"); };
  $("#sheetBg").onclick = closeSheet;
  $("#sheet").addEventListener("click", e => { if(e.target.closest("[data-close]")) closeSheet(); });
  document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

  function conflitos(data, ignoreId){
    return jobs.filter(j => j.dataEntrega === data && j.id !== ignoreId && j.status !== "entregue");
  }
  function avisoHTML(data, ignoreId){
    const c = conflitos(data, ignoreId);
    if(!data || !c.length) return "";
    return `⚠️ Já ${c.length===1?"tem <b>1 job</b>":`tem <b>${c.length} jobs</b>`} com entrega em ${fmtD(data)}:<ul>${c.map(j=>`<li>${esc(j.titulo)} · ${esc(j.cliente)}${j.hora?" · "+j.hora:""} <span style="color:var(--tinta3)">(por ${meuJob(j)?"você":esc(primeiroNome(j.enviadoPor&&j.enviadoPor.nome))})</span></li>`).join("")}</ul><div style="margin-top:6px">Se puder, escolha outro dia ou combine com o Pedro.</div>`;
  }

  /* ---------- colar mensagem (só o Pedro) ---------- */
  const NUM_PT = { "um":1,"uma":1,"dois":2,"duas":2,"tres":3,"três":3 };
  const WD_IDX = { "domingo":0,"segunda":1,"terca":2,"terça":2,"quarta":3,"quinta":4,"sexta":5,"sabado":6,"sábado":6 };
  const norm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function lerSimples(texto){
    // leitura sem IA (reserva): 1 job, procura cliente, data, hora e tipo
    let quem = "";
    const limpo = String(texto).split(/\n/).map(l => { const m2 = l.match(/^\s*\[[^\]]*\]\s*([^:]{1,40}):\s*(.*)$/) || l.match(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}\s*-\s*([^:]{1,40}):\s*(.*)$/); if(m2){ quem = quem || m2[1].trim().split(/\s+/)[0]; return m2[2]; } return l; }).join("\n");
    texto = limpo;
    const t = norm(texto), hoje = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let data = null, m;
    if(/\bhoje\b/.test(t)) data = hoje;
    else if(/depois de amanha/.test(t)) data = new Date(hoje.getTime() + 2*864e5);
    else if(/\bamanha\b/.test(t)) data = new Date(hoje.getTime() + 864e5);
    if(!data && (m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){ let y = m[3] ? +m[3] : hoje.getFullYear(); if(y<100) y+=2000; data = new Date(y, +m[2]-1, +m[1]); if(!m[3] && data < hoje) data.setFullYear(y+1); }
    if(!data && (m = t.match(/\bdia (\d{1,2})\b/))){ data = new Date(hoje.getFullYear(), hoje.getMonth(), +m[1]); if(data < hoje) data = new Date(hoje.getFullYear(), hoje.getMonth()+1, +m[1]); }
    if(!data){ for(const [w,i] of Object.entries(WD_IDX)){ if(new RegExp("\\b"+norm(w)+"(-feira)?\\b").test(t)){ const d = new Date(hoje); let add = (i - d.getDay() + 7) % 7; if(add===0) add = 7; d.setDate(d.getDate()+add); data = d; break; } } }
    let hora = null;
    if((m = t.match(/\b(\d{1,2})(?:h|:)(\d{2})?(?:h|min)?\b/))){ const hh = +m[1]; if(hh<24) hora = `${pad(hh)}:${m[2]||"00"}`; }
    const cliente = CLIENTES.find(c => t.includes(norm(c))) || CLIENTES.find(c => t.includes(norm(c).split(" ").slice(-1)[0]) && norm(c).split(" ").slice(-1)[0].length > 4) || "";
    const TIPO_KW = [["Reels",/reels?|stories|story/],["Motion",/motion|anima/],["Telas / painel",/tela|painel|led/],["Arte / post",/\barte|post|carrossel|feed/],["Captação",/captac|gravac|filmag/],["Roteiro",/roteiro/],["Edição",/edic|editar|corte/],["Vídeo",/video/]];
    const tipo = (TIPO_KW.find(([,r]) => r.test(t)) || [""])[0];
    const linhas = String(texto).split(/\n+/).map(x=>x.replace(/^\[[^\]]*\]\s*[^:]{0,40}:\s*/, "").trim()).filter(Boolean);
    const limpaTit = l => l.replace(/^(oi|ol[aá]|bom dia|boa tarde|boa noite|e a[ií])[,!.\s]*/i, "").replace(/^pedro[,!:\s]+/i, "")
      .replace(/^(a gente |n[oó]s )?(preciso|precisamos|pode(ria)? (me )?fazer|consegue fazer|tem como fazer|queria|quer[ií]amos)( de)?\s+(um|uma|uns|umas|o|a)?\s*/i, "")
      .replace(/[,.;]?\s*(pra|para|com)? ?entrega.*$/i, "").replace(/[,.;]?\s*(at[eé]|pra|para) (hoje|amanh[ãa]|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo|dia \d+|\d{1,2}\/\d{1,2}).*$/i, "").trim();
    let titulo = limpaTit(linhas.find(l => l.length > 6) || linhas[0] || "");
    titulo = (titulo.charAt(0).toUpperCase() + titulo.slice(1)).slice(0, 90);
    return [{ cliente, titulo, tipo, dataEntrega: data ? iso(data) : "", hora: hora || "", obs: String(texto).trim().slice(0, 2000), solicitante: quem }];
  }
  function openColar(){
    openSheet(`
      <div class="sh-head"><h2>Colar <span class="ser">mensagem</span></h2><button class="back" data-close>Fechar</button></div>
      <div class="card note">Cole tudo o que veio sobre o job (WhatsApp, e-mail, transcrição de áudio). O site encontra cliente, tipo, data, horário e quem pediu, e você revisa antes de salvar.</div>
      <div class="fld"><textarea id="colaTxt" rows="9" placeholder="Cole aqui…"></textarea></div>
      <div class="actions"><button class="btn pri full" id="colaLer">Ler e preencher</button></div>`);
    setTimeout(() => $("#colaTxt").focus(), 250);
    $("#colaLer").onclick = async () => {
      const txt = $("#colaTxt").value.trim(); if(!txt){ toast("Cole o texto primeiro."); return; }
      revisar(lerSimples(txt));
    };
  }
  function revisar(lista){
    const opt = (arr, v) => arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
    const bloco = (j, k) => {
      const known = !j.cliente || CLIENTES.includes(j.cliente);
      const c = dataConflitos(j.dataEntrega);
      return `<div class="pj" data-k="${k}">
        <div class="pj-h"><b>Job ${k+1}</b>${lista.length>1?`<button class="back" type="button" data-rmk="${k}">Remover</button>`:""}</div>
        <div class="fld"><label>Cliente</label><select class="pCli"><option value="">Selecione…</option>${opt(CLIENTES, j.cliente)}${!known?`<option selected>${esc(j.cliente)}</option>`:""}</select></div>
        <div class="fld"><label>O que é o job</label><input class="pTit" maxlength="140" value="${esc(j.titulo)}"></div>
        <div class="row2"><div class="fld"><label>Tipo</label><select class="pTipo"><option value="">—</option>${opt(TIPOS, j.tipo)}</select></div>
          <div class="fld"><label>Quem pediu</label><input class="pSol" maxlength="40" value="${esc(j.solicitante||"")}" placeholder="ex.: Aline"></div></div>
        <div class="row2"><div class="fld"><label>Entrega</label><input type="date" class="pData" value="${esc(j.dataEntrega||"")}"></div>
          <div class="fld"><label>Horário</label><input type="time" class="pHora" value="${esc(j.hora||"")}"></div></div>
        ${c?`<div class="warnbox on" style="margin:0 0 8px">⚠️ ${c}</div>`:""}
        <div class="fld"><label>Briefing</label><textarea class="pObs" rows="3" maxlength="2000">${esc(j.obs||"")}</textarea></div>
      </div>`;
    };
    openSheet(`
      <div class="sh-head"><h2>Revisar <span class="ser">${lista.length>1?lista.length+" jobs":"job"}</span></h2><button class="back" data-close>Fechar</button></div>
      <div class="card note">Confira os campos e ajuste o título, se precisar.</div>
      <form id="revForm">${lista.map(bloco).join("")}
      <div class="actions"><button class="btn pri full" type="submit">Salvar ${lista.length>1?lista.length+" jobs":"job"}</button></div></form>`);
    $("#sheetBody").onclick = e => { const r = e.target.closest("[data-rmk]"); if(!r) return; lista.splice(+r.dataset.rmk, 1); revisar(lista); };
    $("#revForm").onsubmit = async ev => {
      ev.preventDefault();
      const itens = [...document.querySelectorAll(".pj")].map(el => ({
        cliente: el.querySelector(".pCli").value, titulo: el.querySelector(".pTit").value.trim(), tipo: el.querySelector(".pTipo").value || null,
        dataEntrega: el.querySelector(".pData").value, hora: el.querySelector(".pHora").value || null, obs: el.querySelector(".pObs").value.trim() || null,
        solicitante: el.querySelector(".pSol").value.trim() || null }));
      const falta = itens.findIndex(x => !x.cliente || !x.titulo || !x.dataEntrega);
      if(falta >= 0){ toast(`Job ${falta+1}: preencha cliente, job e data.`); return; }
      try{
        for(const x of itens) await api.create({ ...x, link: null, status: "novo", enviadoPor: { uid: me.uid, nome: x.solicitante || me.nome, email: me.email }, criadoEm: new Date().toISOString() });
        toast(itens.length > 1 ? `${itens.length} jobs salvos ✓` : "Job salvo ✓"); closeSheet();
        const d = parseISO(itens[0].dataEntrega); view = new Date(d.getFullYear(), d.getMonth(), 1); render();
      }catch(err){ toast("Não consegui salvar: " + (err.code||err.message)); }
    };
  }
  function dataConflitos(data){
    const c = data ? conflitos(data) : [];
    return c.length ? `Já ${c.length===1?"tem 1 job":`tem ${c.length} jobs`} em ${fmtD(data)}: ${c.map(j=>esc(j.titulo)).join(", ")}` : "";
  }

  function openForm(j){
    const v = j || { dataEntrega: "" };
    const known = !v.cliente || CLIENTES.includes(v.cliente);
    openSheet(`
      <div class="sh-head"><h2>${j ? "Editar" : "Novo"} <span class="ser">job</span></h2><button class="back" data-close>Fechar</button></div>
      ${!j && dono ? `<button class="btn sec full" type="button" id="irColar" style="margin-bottom:14px">📋 Colar mensagem e preencher sozinho</button>` : ""}
      <form id="jobForm">
        <div class="sec-t">Sobre o job</div>
        <div class="fld"><label>Cliente</label>
          <select id="fCli" required><option value="">Selecione…</option>${CLIENTES.map(c=>`<option ${c===v.cliente?"selected":""}>${c}</option>`).join("")}<option value="__outro" ${!known?"selected":""}>Outro cliente…</option></select>
          <input id="fCliOutro" placeholder="Nome do cliente" style="margin-top:8px;${known?"display:none":""}" value="${known?"":esc(v.cliente)}"></div>
        <div class="fld"><label>O que é o job</label><input id="fTit" required maxlength="140" value="${esc(v.titulo||"")}" placeholder="Ex.: Reels lançamento torre 2"></div>
        <div class="fld"><label>Tipo</label><select id="fTipo"><option value="">Selecione…</option>${TIPOS.map(t=>`<option ${t===v.tipo?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="sec-t">Entrega</div>
        <div class="row2"><div class="fld"><label>Data de entrega</label><input type="date" id="fData" required ${j?"":`min="${TODAY}"`} value="${v.dataEntrega||""}"></div>
          <div class="fld"><label>Horário <i>· opcional</i></label><input type="time" id="fHora" value="${v.hora||""}"></div></div>
        <div class="warnbox" id="warn"></div>
        <div class="fld"><label>Briefing / observações <i>· opcional</i></label><textarea id="fObs" rows="4" maxlength="2000" placeholder="Formatos, referências, textos, prioridades…">${esc(v.obs||"")}</textarea></div>
        <div class="fld"><label>Link dos arquivos <i>· opcional</i></label><input id="fLink" type="url" maxlength="500" value="${esc(v.link||"")}" placeholder="Drive, WeTransfer…"></div>
        <div class="actions"><button class="btn pri full" type="submit">${j ? "Salvar alterações" : "Enviar job"}</button></div>
      </form>`);
    const upd = () => { const w=$("#warn"), html=avisoHTML($("#fData").value, j&&j.id); w.innerHTML=html; w.classList.toggle("on", !!html); };
    $("#fData").addEventListener("change", upd); upd();
    if($("#irColar")) $("#irColar").onclick = () => openColar();
    $("#fCli").addEventListener("change", e => { $("#fCliOutro").style.display = e.target.value==="__outro" ? "" : "none"; });
    $("#jobForm").addEventListener("submit", async e => {
      e.preventDefault();
      const cli = $("#fCli").value==="__outro" ? $("#fCliOutro").value.trim() : $("#fCli").value;
      if(!cli){ toast("Escolha o cliente."); return; }
      const dados = { cliente: cli, titulo: $("#fTit").value.trim(), tipo: $("#fTipo").value || null,
        dataEntrega: $("#fData").value, hora: $("#fHora").value || null, obs: $("#fObs").value.trim() || null, link: $("#fLink").value.trim() || null };
      try{
        if(j){ await api.update(j.id, { ...dados, atualizadoEm: new Date().toISOString() }); toast("Job atualizado"); }
        else { await api.create({ ...dados, status:"novo", enviadoPor: { uid: me.uid, nome: me.nome, email: me.email }, criadoEm: new Date().toISOString() }); toast("Job enviado ✓ O Pedro vai receber o aviso."); }
        closeSheet(); const d=parseISO(dados.dataEntrega); view=new Date(d.getFullYear(), d.getMonth(), 1); render();
      }catch(err){ toast("Não consegui salvar: " + (err.code||err.message)); }
    });
  }

  function openDetail(j){
    const st = STATUS[j.status] || STATUS.novo, d = parseISO(j.dataEntrega);
    const podeEditar = dono || (meuJob(j) && j.status === "novo");
    const stBtn = (k,l) => `<button class="btn ${j.status===k?"pri":"sec"}" data-st="${k}">${j.status===k?"✓ ":""}${l}</button>`;
    openSheet(`
      <div class="sh-head"><h2>Job</h2><button class="back" data-close>Fechar</button></div>
      <div class="card det"><h3>${esc(j.titulo)}</h3>
        <div class="pills"><span class="pill">${esc(j.cliente)}</span>${j.tipo?`<span class="pill">${esc(j.tipo)}</span>`:""}<span class="pill ${st[1]}">${st[0]}</span></div>
        <dl><dt>Entrega</dt><dd>${WD[d.getDay()]}, ${fmtD(j.dataEntrega)}${j.hora?" · "+j.hora:""}</dd>
        <dt>Pedido por</dt><dd>${j.solicitante ? esc(j.solicitante)+" <span style='color:var(--tinta3)'>· lançado pelo Pedro</span>" : meuJob(j)?"você":esc(j.enviadoPor&&j.enviadoPor.nome||"—")}${dono && j.enviadoPor && j.enviadoPor.email && !meuJob(j) ? ` <span style="color:var(--tinta3)">· ${esc(j.enviadoPor.email)}</span>` : ""}</dd>
        ${j.link?`<dt>Arquivos</dt><dd><a href="${esc(j.link)}" target="_blank" rel="noopener" style="color:var(--tinta)">abrir link</a></dd>`:""}</dl>
        ${j.obs?`<p>${esc(j.obs)}</p>`:""}</div>
      ${dono ? `<div class="sec-t" style="margin:6px 0 8px">Status (a equipe vê)</div>
      <div class="row2">${stBtn("novo","Novo")}${stBtn("producao","Em produção")}</div>
      <div class="row2" style="margin-top:8px">${stBtn("alteracao","Em alteração")}${stBtn("entregue","Entregue")}</div>` : ""}
      <div class="actions">
        ${podeEditar?`<button class="btn sec" data-act="edit">Editar</button><button class="btn dan" data-act="del">${dono?"Excluir job":"Cancelar job"}</button>`:""}
        ${!dono && meuJob(j) && !podeEditar ? `<div class="card note">O Pedro já começou este job. Para mudar algo, fale direto com ele.</div>` : ""}
      </div>`);
    $("#sheetBody").onclick = async e => {
      const st = e.target.closest("[data-st]")?.dataset.st;
      if(st){ try{ await api.update(j.id, { status: st, atualizadoEm: new Date().toISOString() }); toast("Status: " + STATUS[st][0]); closeSheet(); }catch(err){ toast("Não consegui atualizar."); } return; }
      const a = e.target.closest("[data-act]")?.dataset.act; if(!a) return;
      if(a==="edit") openForm(j);
      if(a==="del"){ const b=e.target.closest("[data-act]"); if(b.dataset.c!=="1"){ b.dataset.c="1"; b.textContent=dono?"Toque de novo para excluir":"Toque de novo para cancelar"; return; }
        try{ await api.remove(j.id); toast("Job cancelado"); closeSheet(); }catch(err){ toast("Não consegui cancelar."); } }
    };
  }

  /* ---------- eventos ---------- */
  $("#prevM").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); };
  $("#nextM").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); };
  $("#filters").addEventListener("click", e => { const b=e.target.closest("[data-f]"); if(!b) return; filtro=b.dataset.f; document.querySelectorAll("#filters .chip").forEach(x=>x.classList.toggle("on",x===b)); render(); });
  $("#days").addEventListener("click", e => { const b=e.target.closest("[data-d]"); if(!b) return; const el=document.getElementById("d-"+b.dataset.d); if(el) el.scrollIntoView({behavior:"smooth"}); else if(b.dataset.d>=TODAY) openForm({ dataEntrega: b.dataset.d }); });
  $("#lista").addEventListener("click", e => { const b=e.target.closest("[data-id]"); if(!b) return; const j=jobs.find(x=>x.id===b.dataset.id); if(j) openDetail(j); });
  $("#novoBtn").onclick = () => openForm(null);
  $("#gearBtn").onclick = () => {
    openSheet(`
      <div class="sh-head"><h2>Sua <span class="ser">conta</span></h2><button class="back" data-close>Fechar</button></div>
      <div class="card note">Conectado como <b>${esc(me&&me.nome)}</b><br>${esc(me&&me.email)}${dono?"<br><span style='color:var(--rec)'>Administrador</span>":""}</div>
      <div class="actions">
        ${dono ? `<button class="btn sec" data-set="equipe">Equipe da agência · ${(equipe.emails||[]).length}</button>
        <button class="btn sec" data-set="link">Copiar link para a equipe</button>
        <button class="btn ${window.__pushOn?"sec":"pri"}" data-set="push">${window.__pushOn?"Notificações ativas ✓ (reativar)":"Ativar notificações de job novo"}</button>` : ""}
        ${me && !me.temSenha ? `<button class="btn sec" data-set="senha">Criar senha (para o app no celular)</button>` : ""}
        <button class="btn dan" data-set="sair">Sair</button>
      </div>
      <div class="card note" style="margin-top:14px">No iPhone: abra no Safari → Compartilhar → <b>Adicionar à Tela de Início</b> para ter o atalho.</div>`);
    $("#sheetBody").onclick = async e => {
      const a = e.target.closest("[data-set]")?.dataset.set; if(!a) return;
      if(a==="sair"){ await api.logout(); location.reload(); }
      if(a==="link"){ const u = location.origin + location.pathname.replace(/[^/]*$/, ""); try{ await navigator.clipboard.writeText(u); toast("Link copiado"); }catch(err){ prompt("Link para a equipe:", u); } }
      if(a==="equipe") openEquipe();
      if(a==="push"){ try{ await api.enablePush(); window.__pushOn = true; toast("Notificações ativadas ✓"); closeSheet(); }
        catch(err){ const m = String(err.message||err.code||err); toast(m==="negado" ? "Permissão negada. Libere em Ajustes do iPhone → Notificações." : m==="sem-suporte" ? "Abra pelo atalho da tela inicial (iOS 16.4+) para ativar." : "Erro: " + m); } }
      if(a==="senha"){
        openSheet(`<div class="sh-head"><h2>Criar <span class="ser">senha</span></h2><button class="back" data-close>Fechar</button></div>
          <div class="card note">Use esta senha com o e-mail <b>${esc(me.email)}</b> para entrar pelo atalho do celular.</div>
          <form id="pwForm"><div class="fld"><label>Nova senha (mínimo 6 caracteres)</label><input type="password" id="pw1" minlength="6" required autocomplete="new-password"></div>
          <div class="actions"><button class="btn pri full">Salvar senha</button></div></form>`);
        $("#pwForm").onsubmit = async ev => { ev.preventDefault();
          try{ await api.linkPassword($("#pw1").value); me.temSenha = true; toast("Senha criada ✓"); closeSheet(); }
          catch(err){ const c = String(err.code||""); toast(c.includes("requires-recent-login") ? "Saia e entre de novo, depois crie a senha." : c.includes("weak-password") ? "Senha fraca: use 6+ caracteres." : "Erro: " + c); } };
      }
    };
  };
  function openEquipe(){
    const emails = equipe.emails || [];
    openSheet(`
      <div class="sh-head"><h2>Equipe da <span class="ser">agência</span></h2><button class="back" data-close>Fechar</button></div>
      <div class="card note">Quem estiver aqui pode entrar, enviar jobs e ver todos os jobs. Cada pessoa entra com o próprio Google ou cria e-mail e senha.</div>
      ${emails.length ? emails.map(m=>`<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px"><span style="flex:1;word-break:break-all">${esc(m)}</span><button class="btn dan" data-rm="${esc(m)}" style="padding:8px 12px">Remover</button></div>`).join("") : `<div class="card empty">Ninguém liberado ainda.</div>`}
      <form id="eqForm" style="margin-top:12px"><div class="fld"><label>Liberar e-mail</label><input type="email" id="eqMail" required placeholder="nome@agencia.com.br" autocomplete="off"></div>
      <div class="actions"><button class="btn pri full">Adicionar</button></div></form>`);
    const salvar = async list => { try{ await api.setEquipe(list); equipe.emails = list; toast("Equipe atualizada"); }catch(err){ toast("Não consegui salvar: " + (err.code||err.message)); } };
    $("#eqForm").onsubmit = async ev => { ev.preventDefault(); const m = $("#eqMail").value.trim().toLowerCase(); if(!m) return; if(emails.includes(m)){ toast("Já está na lista."); return; } await salvar(emails.concat(m)); openEquipe(); };
    $("#sheetBody").onclick = async e => { const b = e.target.closest("[data-rm]"); if(!b) return; if(b.dataset.c!=="1"){ b.dataset.c="1"; b.textContent="Confirmar"; return; } await salvar(emails.filter(x=>x!==b.dataset.rm)); openEquipe(); };
  }

  /* ---------- Firebase ---------- */
  async function boot(){
    const cfg = window.ASSESSOR_CONFIG && window.ASSESSOR_CONFIG.firebase;
    if(!cfg){ setStatus("Sem configuração"); $("#loginTxt").textContent = "O sistema ainda não está configurado."; $("#loginArea").style.display="none"; return; }
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [{initializeApp}, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    const app = initializeApp(cfg), auth = A.getAuth(app);
    let db; try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); }catch(e){ db = F.getFirestore(app); }
    const user = await new Promise(res => { const off = A.onAuthStateChanged(auth, u => { off(); res(u); }); });

    $("#googleBtn").onclick = async () => { try{ await A.signInWithPopup(auth, new A.GoogleAuthProvider()); location.reload(); }catch(e){ const c=String(e.code||""); if(c.includes("popup-blocked")||c.includes("operation-not-supported")) await A.signInWithRedirect(auth, new A.GoogleAuthProvider()); else if(!c.includes("popup-closed")) $("#loginErr").textContent = "Erro ao entrar: " + c; } };
    $("#togCriar").onclick = () => { criar = !criar; $("#lgNome").style.display = criar ? "" : "none"; $("#lgNome").required = criar; $("#emailBtn").textContent = criar ? "Criar conta" : "Entrar"; $("#togCriar").textContent = criar ? "Já tenho conta: entrar" : "Primeiro acesso? Criar conta com e-mail e senha"; };
    $("#emailForm").onsubmit = async ev => {
      ev.preventDefault(); $("#loginErr").textContent = "";
      const email = $("#lgEmail").value.trim(), pass = $("#lgPass").value;
      try{
        if(criar){ const cr = await A.createUserWithEmailAndPassword(auth, email, pass); await A.updateProfile(cr.user, { displayName: $("#lgNome").value.trim() }); await A.sendEmailVerification(cr.user); }
        else await A.signInWithEmailAndPassword(auth, email, pass);
        location.reload();
      }catch(e){ const c=String(e.code||""); $("#loginErr").textContent = c.includes("email-already-in-use") ? "Esse e-mail já tem conta. Toque em \"Já tenho conta: entrar\"." : /invalid-credential|wrong-password|user-not-found/.test(c) ? "E-mail ou senha incorretos." : c.includes("weak-password") ? "Senha fraca: use 6+ caracteres." : "Erro: " + c; }
    };
    if(!user){ setStatus("Entre para continuar"); return; }

    if(!user.emailVerified){
      $("#loginTxt").innerHTML = `Enviamos um link de confirmação para <b>${esc(user.email)}</b>. Abra o e-mail, confirme e depois toque em continuar.`;
      $("#loginArea").innerHTML = `<button class="btn pri full" id="contBtn">Já confirmei, continuar</button><button class="tog" id="reenvBtn">Reenviar e-mail</button><button class="tog" id="outBtn">Usar outra conta</button>`;
      $("#contBtn").onclick = async () => { await user.reload(); if(auth.currentUser.emailVerified){ await auth.currentUser.getIdToken(true); location.reload(); } else $("#loginErr").textContent = "Ainda não confirmado. Veja também a caixa de spam."; };
      $("#reenvBtn").onclick = async () => { try{ await A.sendEmailVerification(user); toast("E-mail reenviado"); }catch(e){ toast("Aguarde um pouco e tente de novo."); } };
      $("#outBtn").onclick = async () => { await A.signOut(auth); location.reload(); };
      setStatus("Confirme o e-mail"); return;
    }

    me = { uid: user.uid, email: user.email, nome: user.displayName || user.email.split("@")[0], temSenha: user.providerData.some(p=>p.providerId==="password") };
    const col = F.collection(db, "jobs"), eqRef = F.doc(db, "config", "equipe");
    const setEquipe = emails => F.setDoc(eqRef, { emails, donoUid: user.uid, donoEmail: (user.email||"").toLowerCase(), atualizadoEm: new Date().toISOString() });
    try{
      const eq = await F.getDoc(eqRef);
      if(eq.exists()){ equipe = eq.data(); dono = equipe.donoUid === user.uid; }
      else { try{ await setEquipe([]); dono = true; equipe = { emails: [], donoUid: user.uid }; }catch(e){ dono = false; } }
    }catch(e){ /* sem acesso: tratado abaixo */ }
    if(dono) F.onSnapshot(eqRef, s2 => { if(s2.exists()) equipe = s2.data(); });
    api = {
      create: d => F.addDoc(col, d),
      update: (id, d) => F.updateDoc(F.doc(db, "jobs", id), d),
      remove: id => F.deleteDoc(F.doc(db, "jobs", id)),
      logout: () => A.signOut(auth),
      setEquipe,
      linkPassword: pwd => A.linkWithCredential(user, A.EmailAuthProvider.credential(user.email, pwd)),
      enablePush: async () => {
        if(!("Notification" in window) || !("serviceWorker" in navigator)) throw new Error("sem-suporte");
        const perm = await Notification.requestPermission();
        if(perm !== "granted") throw new Error("negado");
        const M = await import(base + "firebase-messaging.js");
        if(!(await M.isSupported())) throw new Error("sem-suporte");
        const reg = await navigator.serviceWorker.ready;
        const token = await M.getToken(M.getMessaging(app), { vapidKey: window.ASSESSOR_CONFIG.vapidKey, serviceWorkerRegistration: reg });
        if(!token) throw new Error("sem-token");
        await F.setDoc(F.doc(db, "users", user.uid, "tokens", token.slice(-60).replace(/[^\w-]/g, "_")), { token, criadoEm: new Date().toISOString(), aparelho: navigator.userAgent.slice(0, 140) });
      },
    };
    window.__pushOn = ("Notification" in window) && Notification.permission === "granted";
    if(dono && window.__pushOn && window.ASSESSOR_CONFIG.vapidKey) api.enablePush().catch(()=>{});
    F.onSnapshot(col, snap => {
      $("#login").classList.remove("on");
      jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setStatus(snap.metadata.fromCache ? "Offline" : "Sincronizado"); render();
    }, err => {
      if(err.code === "permission-denied"){
        $("#login").classList.add("on");
        $("#loginTxt").innerHTML = `Seu acesso ainda não foi liberado.<br>Peça para o Pedro liberar o e-mail <b>${esc(user.email)}</b> e depois toque em tentar de novo.`;
        $("#loginArea").innerHTML = `<button class="btn pri full" onclick="location.reload()">Tentar de novo</button><button class="tog" id="outBtn2">Usar outra conta</button>`;
        $("#outBtn2").onclick = async () => { await A.signOut(auth); location.reload(); };
        setStatus("Sem acesso");
      } else setStatus("Erro de conexão");
    });
    $("#hSub").textContent = dono ? "Jobs da agência · painel do Pedro" : `Olá, ${primeiroNome(me.nome)} · Horn Films`;
    if(dono){ $("#hTitle").innerHTML = 'Horn <span class="ser">jobs</span>'; $("#novoBtn").textContent = "+ Novo job"; }
  }
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  render();
  boot().catch(e => { console.error(e); setStatus("Erro ao carregar"); });
  window.__lerSimples = lerSimples; window.__revisar = revisar; window.__testSetJobs = (list, eu, d) => { jobs = list; me = eu; dono = !!d;  $("#login").classList.remove("on"); api = { create: async d => { jobs.push({id:"n"+jobs.length, ...d}); render(); }, update: async()=>{}, remove: async()=>{}, logout: async()=>{} }; render(); };
})();
</script>
</body>
</html>
